<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="100%">
  <defs>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <filter id="shield-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .brand-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; font-weight: 900; font-size: 54px; letter-spacing: 6px; }
    .brand-sub { font-family: "JetBrains Mono", Consolas, monospace; font-size: 13px; font-weight: 700; letter-spacing: 4px; fill: #00f0ff; }
  </style>

  <!-- Dark container -->
  <rect width="600" height="200" rx="14" fill="#090d16"/>

  <!-- Logo Emblem (Cyber Radar Shield) -->
  <g transform="translate(40, 30)" filter="url(#shield-glow)">
    <!-- Outer Shield Path -->
    <path d="M 70 10 L 125 35 C 125 90 95 125 70 140 C 45 125 15 90 15 35 Z" fill="none" stroke="url(#shield-grad)" stroke-width="4"/>
    <!-- Inner Radar Concentric Rings -->
    <circle cx="70" cy="70" r="40" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="4 2"/>
    <circle cx="70" cy="70" r="24" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.8"/>
    <circle cx="70" cy="70" r="8" fill="#00f0ff"/>
    <!-- Crosshairs -->
    <line x1="70" y1="25" x2="70" y2="115" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7"/>
    <line x1="25" y1="70" x2="115" y2="70" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7"/>
    <!-- Radar Sweep line -->
    <line x1="70" y1="70" x2="102" y2="38" stroke="#ec4899" stroke-width="2.5"/>
  </g>

  <!-- Typography -->
  <text x="210" y="105" fill="url(#text-grad)" class="brand-title">VERIDY</text>
  <text x="214" y="135" class="brand-sub">OFFENSIVE SURFACE SCANNER</text>
  <line x1="214" y1="148" x2="550" y2="148" stroke="#334155" stroke-width="1.5"/>
</svg>