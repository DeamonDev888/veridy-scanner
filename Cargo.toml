[package]
name = "veridy_scanner"
version = "0.5.0"
edition = "2021"
authors = ["Deamon <contact@veridy.ca>"]
description = "Scanner offensif modulaire (DNS, ports, TLS, HTTP) + 14 modules lecture-seule de preuve d'impact (chainx dispatcher) + catalogue PostgreSQL"
license = "Apache-2.0"
repository = "https://github.com/DeamonDev888/veridy-scanner"
homepage = "https://github.com/DeamonDev888/veridy-scanner"
keywords = ["security", "recon", "scanner", "audit", "pentest"]
categories = ["security", "command-line-utilities"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.6.7", features = ["derive"] }
regex = "1"
postgres = "0.19"